name: Native platform validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  minimum-rust:
    name: Rust 1.86 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum Rust toolchain
        run: rustup toolchain install 1.86.0 --profile minimal
      - name: Install formatting and lint components
        run: rustup component add clippy rustfmt --toolchain 1.86.0
      - name: Record toolchain versions
        run: |
          rustc +1.86.0 --version
          cargo +1.86.0 --version
      - name: Check formatting
        run: cargo +1.86.0 fmt --all -- --check
      - name: Check workspace lints
        run: cargo +1.86.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Test release eligibility rules
        if: matrix.os == 'ubuntu-24.04'
        run: python3 -m unittest discover -s scripts -p test_release_eligibility.py
      - name: Probe local filesystem
        run: cargo +1.86.0 test --locked -p pomodoro-platform --test platform_probe -- --nocapture
      - name: Test workspace including native PTY workflows
        run: cargo +1.86.0 test --locked --workspace
      - name: Test interrupted saves
        run: cargo +1.86.0 test --locked -p pomodoro-platform --lib crash_boundaries_in_isolated_process -- --ignored
      - name: Build workspace
        run: cargo +1.86.0 build --locked --workspace
      - name: Build and exercise Linux release archive
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          bash scripts/package-linux-release.sh
          mkdir -p "$RUNNER_TEMP/pomodoro-release-smoke"
          tar -xzf dist/pomodoro-tui-*.tar.gz -C "$RUNNER_TEMP/pomodoro-release-smoke"
          release_bin="$(find "$RUNNER_TEMP/pomodoro-release-smoke" -type f -name pomodoro-tui -print -quit)"
          test -n "$release_bin"
          POMODORO_TUI_TEST_BIN="$release_bin" cargo +1.86.0 test --locked -p pomodoro-tui --test native_terminal
      - name: Upload Linux release archive for inspection
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-dry-run
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

  stable-rust:
    name: Rust stable / ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Record toolchain versions
        run: |
          rustc +stable --version
          cargo +stable --version
      - name: Test workspace including native PTY workflows
        run: cargo +stable test --locked --workspace
      - name: Build workspace
        run: cargo +stable build --locked --workspace
