[package]
name = "pomodoro-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono.workspace = true
crossterm.workspace = true
pomodoro-core = { path = "../../crates/pomodoro-core" }
pomodoro-platform = { path = "../../crates/pomodoro-platform" }
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
unicode-segmentation.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["pty", "termios", "process"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
portable-pty = "=0.9.0"
tempfile = "3.26.0"

[lints]
workspace = true
